---
- name: Update apt cache
  apt:
    update_cache: yes

- name: Install packages
  apt:
    name:
      - docker.io
      - curl
      - git
    state: present

- name: Start Docker
  service:
    name: docker
    state: started
    enabled: yes

- name: Add ubuntu to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes