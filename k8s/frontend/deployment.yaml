apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: food-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:

      - name: frontend

        image: ahmed7amed9/food-frontend:latest

        imagePullPolicy: Always

        ports:

        - containerPort: 80