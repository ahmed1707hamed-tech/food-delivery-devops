apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: food-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:

      - name: backend

        image: ahmed7amed9/food-backend:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8000

        env:

        - name: DATABASE_URL
          value: postgresql://postgres:postgres@postgres:5432/fooddb